name: SILMO isolated OCCT kernel prototype

on:
  pull_request:
    branches:
      - main
    paths:
      - "research/geometry-kernel-prototype/**"
      - ".github/workflows/kernel-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  occt-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned prototype dependency
        working-directory: research/geometry-kernel-prototype
        run: npm install --no-audit --no-fund
      - name: Run isolated analytic geometry tests
        working-directory: research/geometry-kernel-prototype
        run: npm test
      - name: Download and verify moket OCCT release assets
        working-directory: research/geometry-kernel-prototype
        run: |
          mkdir -p /tmp/silmo-moket
          curl -fsSL https://github.com/moket-io/occt-wasm/releases/download/v0.10.1/index.mjs -o /tmp/silmo-moket/index.mjs
          curl -fsSL https://github.com/moket-io/occt-wasm/releases/download/v0.10.1/occt-wasm.mjs -o /tmp/silmo-moket/occt-wasm.mjs
          curl -fsSL https://github.com/moket-io/occt-wasm/releases/download/v0.10.1/occt-wasm.wasm -o /tmp/silmo-moket/occt-wasm.wasm
          cat > /tmp/silmo-moket.SHA256SUMS <<'EOF'
          716e57771d54b3a0c2ba050274ff52e50eabfac3f46e5145e3866f3c8de97ccc  /tmp/silmo-moket/index.mjs
          112587262e74341827ae9c268e0eeb2873214f7b0d2fd27c278fab738f2f4faa  /tmp/silmo-moket/occt-wasm.mjs
          06cc02b2927f7ed3d70650ecde79e777329975526c75f5e71580ae49f9512ccf  /tmp/silmo-moket/occt-wasm.wasm
          EOF
          sha256sum -c /tmp/silmo-moket.SHA256SUMS
      - name: Compare OCCT wrappers and OpenGeometry candidates
        working-directory: research/geometry-kernel-prototype
        env:
          MOKET_OCCT_DIR: /tmp/silmo-moket
        run: npm run test:candidates
      - name: Install Chromium for worker smoke test
        working-directory: research/geometry-kernel-prototype
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Prepare public WASM asset
        working-directory: research/geometry-kernel-prototype
        run: |
          mkdir -p public
          cp node_modules/occt-wasm/dist/occt-wasm.wasm public/occt-wasm.wasm
      - name: Start Vite prototype server
        working-directory: research/geometry-kernel-prototype
        run: |
          npx vite --host 127.0.0.1 --port 4174 >/tmp/silmo-kernel-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4174/worker-smoke.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/silmo-kernel-vite.log
          exit 1
      - name: Test OCCT in a browser Web Worker
        working-directory: research/geometry-kernel-prototype
        run: npm run test:browser:all
