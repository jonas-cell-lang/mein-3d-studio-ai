name: SILMO code checks

on:
  push:
    branches:
      - development/v30-pwa-ipad-polish
      - development/v29-ipad
      - development/v31-multi-object-move
      - development/v32-object-lock
      - development/v33-object-groups-mirror
      - development/v34-individual-group-edit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      if "src" not in attrs:
                          kind = attrs.get("type", "text/javascript").lower()
                          if kind in ("text/javascript", "application/javascript", "module"):
                              self.current = []

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

          html = Path("index.html").read_text(encoding="utf-8")
          parser = ScriptExtractor()
          parser.feed(html)
          if not parser.scripts:
              raise SystemExit("Keine Inline-JavaScript-Blöcke gefunden.")
          for i, source in enumerate(parser.scripts, 1):
              Path(f"/tmp/silmo-inline-{i}.js").write_text(source, encoding="utf-8")
          print(f"{len(parser.scripts)} Inline-JavaScript-Blöcke gefunden.")
          PY
          for file in /tmp/silmo-inline-*.js; do
            echo "Prüfe $file"
            node --check "$file"
          done
      - name: Validate app manifest and HTML IDs
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest.get("name") == "SILMO 3D Studio AI"
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          duplicates = [value for value, count in Counter(ids).items() if count > 1]
          if duplicates:
              raise SystemExit("Doppelte HTML-IDs: " + ", ".join(duplicates))
          for asset in ("silmo-icon.svg", "icon-512.png", "manifest.webmanifest"):
              if not Path(asset).is_file():
                  raise SystemExit(f"Fehlende App-Datei: {asset}")
          required_group_move = [
              "function getSelectedTargets()",
              "function getSelectionCenter(",
              "dragTargets.forEach((obj, index)",
              "targets.forEach(obj => { obj.position.x += dx; obj.position.y += dy; notifyPositionChanged(obj); });",
          ]
          missing = [item for item in required_group_move if item not in html]
          if missing:
              raise SystemExit("Gruppenverschiebung unvollständig: " + ", ".join(missing))
          required_group_move = [
              "function getSelectedTargets()",
              "function getSelectionCenter(",
              "dragTargets.forEach((obj, index)",
              "targets.forEach(obj => { obj.position.x += dx; obj.position.y += dy; notifyPositionChanged(obj); });",
          ]
          missing = [item for item in required_group_move if item not in html]
          if missing:
              raise SystemExit("Gruppenverschiebung unvollständig: " + ", ".join(missing))
          required_lock_features = [
              "obj.userData.locked = !locked",
              "locked: obj.userData.locked === true",
              "locked: item.locked === true",
              "Gesperrte Objekte können nicht gelöscht werden",
              "Objekt ist gesperrt. Zum Verschieben zuerst entsperren.",
          ]
          missing = [item for item in required_lock_features if item not in html]
          if missing:
              raise SystemExit("Objektsperre unvollständig: " + ", ".join(missing))

          required_group_mirror = [
              "function createObjectGroup()",
              "function ungroupSelectedObjects()",
              "function mirrorSelectedObjects(axis)",
              "groupId: typeof obj.userData.groupId === 'string'",
              "groupId: typeof item.groupId === 'string'",
              "id='createObjectGroup'",
              "id='ungroupObjects'",
              "id='booleanSeparate'",
              "function splitBooleanUnion()",
              "unionParts: Array.isArray(obj.userData.unionParts) ? obj.userData.unionParts : null",
              "b.id='mirror'+axis.toUpperCase()",
          ]
          missing = [item for item in required_group_mirror if item not in html]
          if missing:
              raise SystemExit("Gruppen/Spiegel-Funktionen unvollständig: " + ", ".join(missing))
          required_individual_group_edit = [
              "let individualGroupEdit = false;",
              "Nur dieses Gruppenobjekt bearbeiten",
              "selectedObjects = [obj];",
              "Änderungen betreffen nur dieses Gruppenobjekt",
              "individualGroupEdit = false;",
          ]
          missing = [item for item in required_individual_group_edit if item not in html]
          if missing:
              raise SystemExit("Einzelbearbeitung in Gruppen unvollständig: " + ", ".join(missing))
          if "id='createPhoneCase'" in html or "function createPhoneCase(spec)" in html:
              raise SystemExit("Automatischer Handyhüllen-Generator ist noch vorhanden.")
          if "id='manualPhoneCaseGuide'" in html:
              raise SystemExit("Die entfernte Handyhüllen-Anleitung ist noch vorhanden.")
          required_general_cad = [
              "function createContourFrame()",
              "id='createContourFrame'",
              "id='subtractSelected'",
              "id='wallThicknessMM'",
              "id='frameHeightMM'",
              "mesh.userData.sketchOutline=sketchMetadata.outlinePoints",
              "window.__silmoTestCreateContourFrame",
              "new THREE.ConeGeometry",
              "new THREE.TorusGeometry",
              "new THREE.CylinderGeometry(0.85, 0.85, 1.5, 6)",
          ]
          missing = [item for item in required_general_cad if item not in html]
          if missing:
              raise SystemExit("Allgemeine CAD-Werkzeuge unvollständig: " + ", ".join(missing))
          if "Eigene Hüllen-Konstruktion" in html or "createCaseWallFrame" in html:
              raise SystemExit("Produktgebundene Sonderfunktionen sind noch vorhanden.")
          print("Manifest, App-Symbole, HTML-IDs, Gruppenbewegung, Objektsperre, Gruppen, Spiegeln, Verbindung lösen und allgemeine CAD-Werkzeuge sind statisch geprüft.")
          PY
